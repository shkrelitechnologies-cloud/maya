name: Maya 24x7 maintenance

on:
  schedule:
    # GitHub Actions cron is UTC. Runs every 15 minutes, including overnight.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maya-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run health checks and queue maintenance
        run: python maya_runtime.py
      - name: Preserve health report and queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maya-health-${{ github.run_number }}
          path: |
            state/health.json
            state/daily_state.json
            submission_queue.csv
          if-no-files-found: warn
          retention-days: 30
