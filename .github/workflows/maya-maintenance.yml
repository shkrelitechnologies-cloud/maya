name: Maya 24x7 maintenance # Live execution requested

# The runtime is stateless between runners; operational state is restored from
# the Actions cache and each run's report is retained as an artifact.

on:
  push:
    branches: [main]
    paths:
      - maya.py
      - maya_runtime.py
      - publishing/**
      - sites.csv
      - discovery_candidates.csv
      - tests/**
      - operations_ledger.py
      - config.json
      - OPERATIONS_MANUAL.md
      - .github/workflows/maya-maintenance.yml
      - .github/scripts/watchdog.py
  schedule:
    # GitHub Actions cron is UTC. Runs every 15 minutes, including overnight.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maya-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser discovery runtime
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install chromium
      - name: Validate source, config and whitespace
        run: |
          python -m py_compile maya.py maya_runtime.py publishing/permission_gate.py publishing/discovery.py operations_ledger.py .github/scripts/watchdog.py
          python -m unittest discover -s tests -v
          python -m json.tool config.json > /dev/null
          git diff --check
      - name: Restore persistent operational state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: maya-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            maya-state-${{ github.ref_name }}-
      - name: Run health checks and queue maintenance
        run: python maya_runtime.py
      - name: Save persistent operational state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: maya-state-${{ github.ref_name }}-${{ github.run_id }}
      - name: Commit repository-local operations ledger
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/maya-ledger"
          cp operations/OPERATIONS_LEDGER.csv "$RUNNER_TEMP/maya-ledger/OPERATIONS_LEDGER.csv"
          cp operations/DAILY_SUMMARY.csv "$RUNNER_TEMP/maya-ledger/DAILY_SUMMARY.csv"
          git fetch origin main
          # Rebase the ledger update onto the latest main without force-pushing.
          git reset --hard FETCH_HEAD
          python - <<'PY'
          import csv
          from pathlib import Path
          from operations_ledger import FIELDS, _read, _atomic_csv, rebuild_summary

          root = Path(".")
          remote_path = root / "operations" / "OPERATIONS_LEDGER.csv"
          local_path = Path(__import__("os").environ["RUNNER_TEMP"]) / "maya-ledger" / "OPERATIONS_LEDGER.csv"
          rows = _read(remote_path, FIELDS)
          known = {row.get("event_id") for row in rows}
          for row in _read(local_path, FIELDS):
              if row.get("event_id") not in known:
                  rows.append(row)
                  known.add(row.get("event_id"))
          _atomic_csv(remote_path, FIELDS, rows)
          rebuild_summary(root)
          PY
          git config user.name 'Maya operations bot'
          git config user.email 'maya-operations@users.noreply.github.com'
          git add -- operations/OPERATIONS_LEDGER.csv operations/DAILY_SUMMARY.csv
          if git diff --cached --quiet; then
            echo 'Operations ledger unchanged.'
            exit 0
          fi
          git commit -m "Update Maya IST operations ledger"
          git push origin HEAD:main
      - name: Preserve health report and queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maya-health-${{ github.run_number }}
          path: |
            state/health.json
            state/daily_state.json
            state/discovery_leads.json
            submission_queue.csv
            operations/OPERATIONS_LEDGER.csv
            operations/DAILY_SUMMARY.csv
          if-no-files-found: warn
          retention-days: 30
